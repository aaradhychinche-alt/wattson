[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wattson"
version = "0.1.0"
description = "WATTSON - evidence-based, self-driving AI cloud optimizer"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "Apache-2.0" }
dependencies = [
  "alembic>=1.14,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "PyYAML>=6.0.2,<7",
  "sqlalchemy>=2.0.35,<3",
  "temporalio>=1.9,<2",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.13,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.8,<1",
  "types-PyYAML>=6.0.12",
]
jarvis = ["jarvislabs>=0.2.0,<0.3"]

[project.scripts]
wattson-demo = "wattson.demo:main"
wattson-gemma-compare = "wattson.ai.compare:main"

[tool.hatch.build.targets.wheel]
packages = ["backend/wattson"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"
filterwarnings = [
  "ignore::DeprecationWarning:temporalio.*",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["backend", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["SIM117"]

[tool.mypy]
python_version = "3.12"
mypy_path = "backend"
packages = ["wattson"]
strict = false
check_untyped_defs = true
disallow_untyped_defs = false
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true
